<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Adicionar tara de entrada AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Adicionar tara | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell weighbridge-shell">
      <section class="content-card admin-card weighbridge-card" aria-labelledby="input-tare-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área da balança</span>
            <h1 id="input-tare-title" class="page-title">Adicionar tara</h1>
            <a class="back-link admin-back-link" href="{{WEIGHBRIDGE_HOME_HREF}}">{{WEIGHBRIDGE_HOME_LABEL}}</a>
          </div>
        </div>

        {{SCALE_INPUT_ERROR}}
        <p class="page-description">{{INPUT_SUMMARY}}</p>

        <form class="contact-form contracts-form" action="/balanca/entradas/{{ENTRADA_ID}}/tara" method="post">
            <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
          <div class="contracts-form-grid contracts-form-grid-two">
            <label>Peso tara (kg)
              <span class="weighbridge-weight-input-group">
                <input class="form-control" id="peso_tara_kg" name="peso_tara_kg" type="number" min="0.001" step="0.001" value="{{PESO_TARA_KG}}" inputmode="decimal" required>
                <button class="weighbridge-weight-fetch" type="button" data-scale-weight-target="peso_tara_kg" aria-label="Preencher tara com o peso da balança 1" title="Usar peso da balança 1">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14M7 20l1-10h8l1 10M9 10a3 3 0 0 1 6 0M12 10l2-2"/></svg>
                </button>
              </span>
              <span class="weighbridge-weight-feedback" aria-live="polite"></span>
            </label>
          </div>
          <div class="contracts-form-actions">
            <button class="btn-primary-action" type="submit">Salvar tara</button>
            <a class="btn-secondary-action" href="{{WEIGHBRIDGE_HOME_HREF}}">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/weighbridge-scale-weight.js"></script>
  </body>
</html>
