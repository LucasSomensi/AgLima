<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Formulário administrativo de contratos da AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>{{PAGE_TITLE}} | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell contracts-shell">
      <section class="content-card admin-card contracts-card" aria-labelledby="form-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área administrativa</span>
            <h1 id="form-title" class="page-title">{{FORM_TITLE}}</h1>
            <p class="page-description">{{FORM_DESCRIPTION}}</p>
            <a class="back-link admin-back-link" href="/admin/contratos">← Voltar aos contratos</a>
          </div>
          <form action="/logout" method="post">
            <button class="btn-secondary-action" type="submit">Sair</button>
          </form>
        </div>
        {{CONTRACTS_ERROR}}
        {{FORM_HTML}}
      </section>
    </main>
    <footer class="site-footer">
      <img class="footer-logo" src="/images/logotipo%20agrolima.jpeg" alt="Logotipo da AgroLima">
      <span>AgroLima © 2026. Todos os direitos reservados.</span>
    </footer>
  </body>
</html>
