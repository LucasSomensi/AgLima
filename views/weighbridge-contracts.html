<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Contratos com embarque pendente">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Contratos | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body class="wb-body">
    <main class="wb-shell">
      {{WB_TOPBAR}}
      <section class="wb-panel">
        <div class="wb-panel-head">
          {{CONTRACT_FILTER_TOGGLE}}
          <div class="wb-panel-tools">
            <div class="wb-seg contracts-weight-toggle" role="group" aria-label="Unidade de peso exibida">
              <button class="contracts-weight-toggle-button" type="button" data-weight-unit="kg" aria-pressed="true">kg</button>
              <button class="contracts-weight-toggle-button" type="button" data-weight-unit="sc" aria-pressed="false">sc</button>
            </div>
          </div>
        </div>
        <div class="wb-table-wrap">
          <table class="wb-table">
            <thead>
              <tr>
                <th>Nº</th>
                <th>Data</th>
                <th>Comprador</th>
                <th>Produto</th>
                <th class="num">Quantidade</th>
                <th class="num">Embarcado</th>
                <th class="num">Saldo</th>
              </tr>
            </thead>
            <tbody>
              {{CONTRACT_ROWS}}
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/js/weighbridge-ui.js"></script>
    <script>
      (function () {
        const buttons = document.querySelectorAll('[data-weight-unit]');
        const formatter = {
          kg: new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }),
          sc: new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 }),
        };

        function setUnit(unit) {
          buttons.forEach((button) => button.setAttribute('aria-pressed', button.dataset.weightUnit === unit ? 'true' : 'false'));
          document.querySelectorAll('.weighbridge-contract-weight').forEach((element) => {
            const kg = Number(element.dataset.weightKg);
            if (!Number.isFinite(kg)) return;
            element.textContent = unit === 'sc' ? `${formatter.sc.format(kg / 60)} sc` : `${formatter.kg.format(kg)} kg`;
          });
        }

        buttons.forEach((button) => button.addEventListener('click', () => setUnit(button.dataset.weightUnit)));
      }());
    </script>
  </body>
</html>
