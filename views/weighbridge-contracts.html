<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Contratos abertos para embarque na balança AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Contratos da balança | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell weighbridge-shell">
      <section class="content-card admin-card weighbridge-card" aria-labelledby="contracts-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área da balança</span>
            <h1 id="contracts-title" class="page-title">Contratos com embarque pendente</h1>
            <a class="back-link admin-back-link" href="{{WEIGHBRIDGE_HOME_HREF}}">{{WEIGHBRIDGE_HOME_LABEL}}</a>
          </div>
        </div>

        <div class="contracts-weight-toggle" role="group" aria-label="Unidade de peso exibida">
          <span class="admin-muted">Exibir pesos em:</span>
          <button class="btn-secondary-action contracts-weight-toggle-button is-active" type="button" data-weight-unit="kg" aria-pressed="true">kg</button>
          <button class="btn-secondary-action contracts-weight-toggle-button" type="button" data-weight-unit="sc" aria-pressed="false">sc</button>
        </div>

        <div class="admin-table-wrapper">
          <table class="admin-table weighbridge-table">
            <thead>
              <tr>
                <th>Número do contrato</th>
                <th>Data do contrato</th>
                <th>Comprador</th>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Embarcado</th>
                <th>Saldo</th>
              </tr>
            </thead>
            <tbody>
              {{CONTRACT_ROWS}}
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      (function () {
        const toggleButtons = Array.from(document.querySelectorAll('[data-weight-unit]'));
        const weightFields = Array.from(document.querySelectorAll('.weighbridge-contract-weight[data-weight-kg]'));

        function formatWeight(value, unit) {
          const formatter = new Intl.NumberFormat('pt-BR', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 3,
          });
          const weightKg = Number(value);
          const displayWeight = unit === 'sc' ? weightKg / 60 : weightKg;

          return formatter.format(displayWeight) + ' ' + unit;
        }

        function setWeightUnit(unit) {
          weightFields.forEach(function (field) {
            field.textContent = formatWeight(field.dataset.weightKg, unit);
          });

          toggleButtons.forEach(function (button) {
            const isSelected = button.dataset.weightUnit === unit;
            button.classList.toggle('is-active', isSelected);
            button.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
          });
        }

        toggleButtons.forEach(function (button) {
          button.addEventListener('click', function () {
            setWeightUnit(button.dataset.weightUnit);
          });
        });
      }());
    </script>
  </body>
</html>
