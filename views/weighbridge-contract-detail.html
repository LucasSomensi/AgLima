<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Detalhes do contrato na balança">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Contrato | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body class="wb-body">
    <main class="wb-shell">
      {{WB_TOPBAR}}
      <section class="wb-panel">
        <div class="wb-copy-grid">
          {{CONTRACT_FIELDS}}
        </div>
      </section>

      <section class="wb-panel" aria-labelledby="contract-outputs-title">
        <div class="wb-panel-head"><h2 id="contract-outputs-title">Saídas associadas <span class="wb-count">{{NUMERO_SAIDAS}}</span></h2></div>
        <div class="wb-table-wrap">
          <table class="wb-table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Placa</th>
                <th>Produto</th>
                <th class="num">Tara <small>kg</small></th>
                <th class="num">Bruto <small>kg</small></th>
                <th class="num">Líquido <small>kg</small></th>
                <th class="wb-col-actions"><span class="sr-only">Ações</span></th>
              </tr>
            </thead>
            <tbody>
              {{OUTPUT_ROWS}}
            </tbody>
          </table>
        </div>
      </section>
      {{RECEIPTS_SECTION}}
    </main>
    <script src="/js/weighbridge-ui.js"></script>
  </body>
</html>
