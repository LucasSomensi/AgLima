<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Entre em contato com a AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Contato | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell">
      <section class="content-card contact-card" aria-labelledby="contact-title">
        <a class="back-link" href="/" aria-label="Voltar para a página inicial">← Voltar</a>
        <span class="eyebrow">Fale conosco</span>
        <h1 id="contact-title" class="page-title">Contato AgroLima</h1>
        <p class="page-description">Preencha o formulário abaixo para preparar uma mensagem para contato@agrolima.com.br.</p>

        <form class="contact-form" action="mailto:contato@agrolima.com.br" method="post" enctype="text/plain">
          <div class="form-group">
            <label for="name">Nome</label>
            <input class="form-control" id="name" name="Nome" type="text" placeholder="Seu nome" required>
          </div>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input class="form-control" id="email" name="E-mail" type="email" placeholder="voce@exemplo.com" required>
          </div>
          <div class="form-group">
            <label for="subject">Assunto</label>
            <input class="form-control" id="subject" name="Assunto" type="text" placeholder="Como podemos ajudar?" required>
          </div>
          <div class="form-group">
            <label for="message">Mensagem</label>
            <textarea class="form-control" id="message" name="Mensagem" rows="6" placeholder="Escreva sua mensagem" required></textarea>
          </div>
          <button class="btn-primary-action" type="submit">Enviar e-mail</button>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <span>AgroLima © 2026. Todos os direitos reservados.</span>
    </footer>
  </body>
</html>
