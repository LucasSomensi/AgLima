<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Definir origem de entrada AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Definir origem | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell weighbridge-shell">
      <section class="content-card admin-card weighbridge-card" aria-labelledby="input-origin-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área da balança</span>
            <h1 id="input-origin-title" class="page-title">Definir origem</h1>
            <a class="back-link admin-back-link" href="/balanca">← Voltar à balança</a>
          </div>
        </div>

        {{SCALE_INPUT_ERROR}}
        <p class="page-description">{{INPUT_SUMMARY}}</p>

        <form class="contact-form contracts-form" action="/balanca/entradas/{{ENTRADA_ID}}/origem" method="post">
          <div class="contracts-form-grid contracts-form-grid-two">
            <label>Origem
              <input class="form-control" name="origem" type="text" maxlength="200" value="{{ORIGEM}}" placeholder="Fazenda São José" required>
            </label>
          </div>
          <div class="contracts-form-actions">
            <button class="btn-primary-action" type="submit">Salvar origem</button>
            <a class="btn-secondary-action" href="/balanca">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
