<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="Lucas">
    <meta name="description" content="Confirmar silo de descarga do secador da AgroLima">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Confirmar descarga | AgroLima</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/icons/dryer-icon-192.png">
    <meta name="theme-color" content="#0f5f2e">
  </head>
  <body>
    <main class="page-shell admin-shell dryer-shell">
      <section class="content-card admin-card dryer-card" aria-labelledby="discharge-title">
        <div class="admin-header">
          <div>
            <h1 id="discharge-title" class="page-title">Iniciar descarga</h1>
            <p class="admin-subtitle">{{DISCHARGE_PROMPT}}</p>
          </div>
        </div>

        <form class="dryer-discharge-form" action="/secador/bateladas/descarga" method="post">
          <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
          {{LAST_SILO_INPUT}}

          <fieldset class="dryer-silo-chooser" data-silo-chooser {{CHOOSER_HIDDEN}}>
            <legend class="dryer-field-label">Escolha o silo de destino</legend>
            <div class="dryer-silo-options">
              {{SILO_OPTIONS}}
            </div>
          </fieldset>

          <div class="dryer-start-actions">
            <button class="btn-primary-action" type="submit" data-confirm-button>{{CONFIRM_LABEL}}</button>
            <button class="btn-secondary-action" type="button" data-choose-other {{CHOOSE_OTHER_HIDDEN}}>Escolher outro silo</button>
            <a class="btn-secondary-action" href="/secador">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/dryer-pwa.js" defer></script>
    <script>
      const form = document.querySelector('.dryer-discharge-form');
      const siloInput = form?.querySelector('[data-silo-input]');
      const chooser = form?.querySelector('[data-silo-chooser]');
      const chooseOtherButton = form?.querySelector('[data-choose-other]');
      const confirmButton = form?.querySelector('[data-confirm-button]');

      chooseOtherButton?.addEventListener('click', () => {
        chooser.hidden = false;
        chooseOtherButton.hidden = true;
        siloInput.value = '';
        confirmButton.textContent = 'Confirmar';
      });

      form?.querySelectorAll('[data-silo-number]').forEach((button) => {
        button.addEventListener('click', () => {
          const siloNumber = button.dataset.siloNumber;
          siloInput.value = siloNumber;
          confirmButton.textContent = `Confirmar silo ${siloNumber}`;
          form.querySelectorAll('[data-silo-number]').forEach((option) => {
            option.classList.toggle('btn-primary-action', option === button);
            option.classList.toggle('btn-secondary-action', option !== button);
          });
        });
      });

      form?.addEventListener('submit', (event) => {
        if (!siloInput.value || form.dataset.submitting === 'true') {
          event.preventDefault();
          return;
        }

        form.dataset.submitting = 'true';
        confirmButton.disabled = true;
        confirmButton.textContent = 'Iniciando descarga...';
      });
    </script>
    <footer class="site-footer">
      <img class="footer-logo" src="/images/logotipo%20agrolima.jpeg" alt="Logotipo da AgroLima">
      <span>AgroLima © 2026. Todos os direitos reservados.</span>
    </footer>
  </body>
</html>
