<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="Lucas">
    <meta name="description" content="Recebimentos de contratos da AgroLima">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Recebimentos | AgroLima</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell contracts-shell">
      <section class="content-card admin-card contracts-card" aria-labelledby="receipts-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área administrativa</span>
            <h1 id="receipts-title" class="page-title">Recebimentos</h1>
            <a class="back-link admin-back-link" href="/admin">← Voltar à administração</a>
          </div>
          <form action="/logout" method="post">
            <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
            <button class="btn-secondary-action" type="submit">Sair</button>
          </form>
        </div>

        {{MESSAGE}}
        {{ERROR}}

        <section class="admin-section" aria-labelledby="new-receipt-title">
          <h2 id="new-receipt-title">Novo recebimento</h2>
          <form class="contact-form contracts-form" action="/admin/recebimentos" method="post">
            <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
            <div class="contracts-form-grid">
              <label>Contrato<select class="form-control" name="contrato_id" required><option value="">Selecione</option>{{CONTRACT_OPTIONS}}</select></label>
              <label>Data do recebimento<input class="form-control" name="data_recebimento" type="date" value="{{INPUT_DATE}}" required></label>
              <label>Valor recebido (R$)<input class="form-control" name="valor" type="text" inputmode="numeric" autocomplete="off" placeholder="0,00" value="{{INPUT_VALUE}}" required></label>
            </div>
            <label>Comentário (opcional)<textarea class="form-control" name="observacao" maxlength="200" rows="1">{{INPUT_NOTE}}</textarea></label>
            <div class="contracts-form-actions"><button class="btn-primary-action" type="submit" {{DISABLED}}>Registrar recebimento</button></div>
            {{NO_CONTRACTS}}
          </form>
        </section>

        <section class="admin-section" aria-labelledby="receipt-list-title">
          <h2 id="receipt-list-title">Todos os recebimentos</h2>
          <div class="admin-table-wrapper contracts-table-wrapper">
            <table class="admin-table contracts-table">
              <thead><tr><th>Data</th><th>Contrato</th><th>Comprador</th><th>Valor</th><th>Comentário</th><th>Registrado por</th><th>Registrado em</th></tr></thead>
              <tbody>{{ROWS}}</tbody>
            </table>
          </div>
          {{PAGINATION}}
        </section>
      </section>
    </main>
    <footer class="site-footer">
      <img class="footer-logo" src="/images/logotipo%20agrolima.jpeg" alt="Logotipo da AgroLima">
      <span>AgroLima © 2026. Todos os direitos reservados.</span>
    </footer>
    <script src="/js/receipt-value.js"></script>
  </body>
</html>
