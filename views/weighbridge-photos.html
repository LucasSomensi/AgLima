<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Fotos automáticas da balança AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Fotos da balança | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell weighbridge-shell">
      <section class="content-card admin-card weighbridge-card" aria-labelledby="photos-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área da balança</span>
            <h1 id="photos-title" class="page-title">Fotos automáticas</h1>
            <a class="back-link admin-back-link" href="{{WEIGHBRIDGE_HOME_HREF}}">{{WEIGHBRIDGE_HOME_LABEL}}</a>
          </div>
        </div>

        {{SCALE_PHOTOS_ERROR}}

        <form class="contact-form scale-photos-filter" action="/balanca/fotos" method="get">
          <label>Data
            <input class="form-control" name="data" type="date" value="{{FOTOS_DATA}}" required>
          </label>
          <button class="btn-primary-action" type="submit">Ver fotos</button>
        </form>

        <section class="admin-section">
          <p class="admin-muted">Total: {{FOTOS_TOTAL}}. Tiradas pelo AutoWeight ao final de cada pesagem e guardadas por {{FOTOS_RETENCAO}} dias.</p>
          {{SCALE_PHOTOS}}
        </section>
      </section>
    </main>
  </body>
</html>
