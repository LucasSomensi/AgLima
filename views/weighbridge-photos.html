<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Fotos automáticas da balança">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Fotos automáticas | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body class="wb-body">
    <main class="wb-shell">
      {{WB_TOPBAR}}
      {{SCALE_PHOTOS_ERROR}}
      <section class="wb-panel">
        <div class="wb-panel-head">
          <form class="wb-form wb-summary-line" action="/balanca/fotos" method="get">
            <input class="form-control" name="data" type="date" value="{{FOTOS_DATA}}" required aria-label="Data" onchange="this.form.submit()" style="width:auto">
            <noscript><button class="wb-btn" type="submit">Ver</button></noscript>
          </form>
          <span class="wb-muted wb-panel-tools">Total: {{FOTOS_TOTAL}}. Tiradas pelo AutoWeight; guardadas por {{FOTOS_RETENCAO}} dias.</span>
        </div>
        {{SCALE_PHOTOS}}
      </section>
    </main>
    <script src="/js/weighbridge-ui.js"></script>
  </body>
</html>
