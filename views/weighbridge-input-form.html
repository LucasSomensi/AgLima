<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Adicionar entrada na balança">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Nova entrada | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body class="wb-body">
    <main class="wb-shell">
      {{WB_TOPBAR}}
      {{SCALE_INPUT_ERROR}}
      <section class="wb-panel">
        <form class="wb-form" action="/balanca/entradas" method="post">
          <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
          <div class="wb-form-grid">
            <label class="weighbridge-plate-field">Placa
              <input class="form-control" id="placa_caminhao" name="placa_caminhao" type="text" value="{{PLACA_CAMINHAO}}" placeholder="ABC1D23" maxlength="10" autocomplete="off" required autofocus>
              <span class="weighbridge-plate-options" id="plate-options" aria-live="polite">{{PLATE_SUGGESTIONS}}</span>
            </label>
            <label>Produto
              <select class="form-control" id="produto" name="produto" required>
                <option value="">Selecione</option>
                <option value="milho"{{PRODUCT_MILHO_SELECTED}}>Milho</option>
                <option value="soja"{{PRODUCT_SOJA_SELECTED}}>Soja</option>
              </select>
            </label>
            <label>Data/hora
              <input class="form-control" id="data_entrada" name="data_entrada" type="datetime-local" value="{{DATA_ENTRADA}}" required data-scale-photo-datetime>
            </label>
            <label class="wb-weight-field">Bruto (kg)
              <span class="weighbridge-weight-input-group">
                <input class="form-control" id="peso_bruto_kg" name="peso_bruto_kg" type="number" min="0.001" max="79999.999" step="0.001" value="{{PESO_BRUTO_KG}}" inputmode="decimal" required>
                <button class="weighbridge-weight-fetch" type="button" data-scale-weight-target="peso_bruto_kg" aria-label="Preencher peso bruto com o peso da balança 1" title="Usar peso da balança 1">
                  <svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-scale"></use></svg>
                </button>
                <button class="weighbridge-weight-fetch" type="button" data-scale-photo-pick-target="peso_bruto_kg" aria-label="Preencher peso bruto com uma foto automática da balança 1" title="Usar foto automática da balança 1">
                  <svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-photo"></use></svg>
                </button>
              </span>
              <span class="weighbridge-weight-feedback" aria-live="polite"></span>
              <input type="hidden" name="foto_captura_id" value="{{FOTO_CAPTURA_ID}}" data-scale-photo-capture>
              <span class="weighbridge-weight-photo" data-scale-photo-preview hidden></span>
            </label>
          </div>
          <div class="wb-form-actions">
            <label class="contracts-checkbox" id="previous-tare-wrapper" title="Usa a última tara registrada para esta placa.">
              <input id="usar_tara_anterior" name="usar_tara_anterior" type="checkbox"{{USAR_TARA_ANTERIOR_CHECKED}} disabled>
              Usar tara anterior <span class="wb-muted weighbridge-tare-help" id="previous-tare-help">sem tara anterior</span>
            </label>
          </div>
          <div class="wb-form-actions">
            <button class="wb-btn wb-btn--primary" type="submit"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-check"></use></svg><span>Confirmar entrada</span></button>
            <a class="wb-btn" href="{{WEIGHBRIDGE_HOME_HREF}}">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <script>
      (function () {
        const dateInput = document.getElementById('data_entrada');
        const productSelect = document.getElementById('produto');
        const plateInput = document.getElementById('placa_caminhao');
        const optionsContainer = document.getElementById('plate-options');
        const previousTareCheckbox = document.getElementById('usar_tara_anterior');
        const previousTareHelp = document.getElementById('previous-tare-help');
        const weightFormatter = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
        let controller = null;
        let productWasChanged = {{PRODUCT_WAS_CHANGED}};

        function getDefaultProduct(dateValue) {
          const monthMatch = String(dateValue || '').match(/^\d{4}-(\d{2})/);

          if (!monthMatch) {
            return 'milho';
          }

          return Number(monthMatch[1]) <= 4 ? 'soja' : 'milho';
        }

        function updateDefaultProduct() {
          if (!productWasChanged) {
            productSelect.value = getDefaultProduct(dateInput.value);
          }
        }

        function normalizePlate(value) {
          return String(value || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        }

        function setPreviousTareState(hasTare, tareLabel) {
          previousTareCheckbox.disabled = !hasTare;
          if (!hasTare) {
            previousTareCheckbox.checked = false;
          }
          previousTareHelp.textContent = hasTare
            ? (tareLabel ? weightFormatter.format(Number(tareLabel)) + ' kg' : 'disponível')
            : 'sem tara anterior';
        }

        function renderOptions(plates) {
          optionsContainer.replaceChildren();

          if (!plates.length) {
            const empty = document.createElement('span');
            empty.className = 'weighbridge-plate-empty';
            empty.textContent = 'Nenhuma placa recente.';
            optionsContainer.append(empty);
            return;
          }

          plates.forEach(function (plate) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'weighbridge-plate-option';
            button.dataset.plate = plate.placa_caminhao;
            button.dataset.hasTare = plate.tem_tara_anterior ? '1' : '0';
            button.dataset.tare = plate.peso_tara_kg || '';
            button.textContent = plate.placa_caminhao + (plate.tem_tara_anterior ? ' · tara ' + weightFormatter.format(Number(plate.peso_tara_kg)) + ' kg' : '');
            optionsContainer.append(button);
          });
        }

        async function fetchPlates() {
          if (controller) {
            controller.abort();
          }

          controller = new AbortController();
          const query = normalizePlate(plateInput.value);
          const response = await fetch('/balanca/entradas/placas?q=' + encodeURIComponent(query), { signal: controller.signal });

          if (!response.ok) {
            return;
          }

          renderOptions(await response.json());
        }

        async function fetchPreviousTare() {
          const plate = normalizePlate(plateInput.value);

          if (plate.length < 7) {
            setPreviousTareState(false);
            return;
          }

          const response = await fetch('/balanca/entradas/tara-anterior?placa=' + encodeURIComponent(plate));

          if (!response.ok) {
            setPreviousTareState(false);
            return;
          }

          const tare = await response.json();
          setPreviousTareState(Boolean(tare && tare.id), tare && tare.peso_tara_kg);
        }

        optionsContainer.addEventListener('click', function (event) {
          const option = event.target.closest('.weighbridge-plate-option');

          if (!option) {
            return;
          }

          plateInput.value = option.dataset.plate;
          setPreviousTareState(option.dataset.hasTare === '1', option.dataset.tare);
          document.getElementById('peso_bruto_kg').focus();
        });

        dateInput.addEventListener('input', updateDefaultProduct);
        productSelect.addEventListener('change', function () {
          productWasChanged = true;
        });

        plateInput.addEventListener('input', function () {
          plateInput.value = normalizePlate(plateInput.value);
          fetchPlates().catch(function () {});
          fetchPreviousTare().catch(function () {});
        });

        updateDefaultProduct();
        fetchPreviousTare().catch(function () {});
      }());
    </script>
    <script src="/js/weighbridge-scale-weight.js"></script>
    <script src="/js/weighbridge-ui.js"></script>
  </body>
</html>
