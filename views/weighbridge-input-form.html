<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Adicionar entrada da balança AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Adicionar entrada | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell weighbridge-shell">
      <section class="content-card admin-card weighbridge-card" aria-labelledby="input-form-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área da balança</span>
            <h1 id="input-form-title" class="page-title">Adicionar entrada</h1>
            <a class="back-link admin-back-link" href="{{WEIGHBRIDGE_HOME_HREF}}">{{WEIGHBRIDGE_HOME_LABEL}}</a>
          </div>
        </div>

        {{SCALE_INPUT_ERROR}}

        <form class="contact-form contracts-form" action="/balanca/entradas" method="post">
            <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
          <div class="contracts-form-grid contracts-form-grid-two">
            <label>Data e hora da entrada
              <input class="form-control" id="data_entrada" name="data_entrada" type="datetime-local" value="{{DATA_ENTRADA}}" required>
            </label>
            <label>Produto
              <select class="form-control" id="produto" name="produto" required>
                <option value="">Selecione</option>
                <option value="milho"{{PRODUCT_MILHO_SELECTED}}>Milho</option>
                <option value="soja"{{PRODUCT_SOJA_SELECTED}}>Soja</option>
              </select>
            </label>
            <label class="weighbridge-plate-field">Placa do veículo
              <input class="form-control" id="placa_caminhao" name="placa_caminhao" type="text" value="{{PLACA_CAMINHAO}}" placeholder="ABC1D23" maxlength="10" autocomplete="off" required>
              <span class="admin-muted">Escolha uma das placas recentes ou digite uma nova placa.</span>
              <div class="weighbridge-plate-options" id="plate-options" aria-live="polite">
                {{PLATE_SUGGESTIONS}}
              </div>
            </label>
            <label>Peso bruto (kg)
              <input class="form-control" name="peso_bruto_kg" type="number" min="0.001" max="79999.999" step="0.001" value="{{PESO_BRUTO_KG}}" inputmode="decimal" required>
            </label>
          </div>

          <div class="contracts-check-grid">
            <label class="contracts-checkbox" id="previous-tare-wrapper" title="Selecione uma placa com tara anterior para habilitar esta opção.">
              <input id="usar_tara_anterior" name="usar_tara_anterior" type="checkbox"{{USAR_TARA_ANTERIOR_CHECKED}} disabled>
              Usar tara anterior
            </label>
            <span class="weighbridge-tare-help" id="previous-tare-help">Selecione uma placa já utilizada para verificar se existe tara anterior.</span>
          </div>

          <div class="contracts-form-actions">
            <button class="btn-primary-action" type="submit">Confirmar entrada</button>
            <a class="btn-secondary-action" href="{{WEIGHBRIDGE_HOME_HREF}}">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <script>
      (function () {
        const dateInput = document.getElementById('data_entrada');
        const productSelect = document.getElementById('produto');
        const plateInput = document.getElementById('placa_caminhao');
        const optionsContainer = document.getElementById('plate-options');
        const previousTareCheckbox = document.getElementById('usar_tara_anterior');
        const previousTareHelp = document.getElementById('previous-tare-help');
        let controller = null;
        let productWasChanged = {{PRODUCT_WAS_CHANGED}};

        function getDefaultProduct(dateValue) {
          const monthMatch = String(dateValue || '').match(/^\d{4}-(\d{2})/);

          if (!monthMatch) {
            return 'milho';
          }

          return Number(monthMatch[1]) <= 4 ? 'soja' : 'milho';
        }

        function updateDefaultProduct() {
          if (!productWasChanged) {
            productSelect.value = getDefaultProduct(dateInput.value);
          }
        }

        function normalizePlate(value) {
          return String(value || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        }

        function setPreviousTareState(hasTare, tareLabel) {
          previousTareCheckbox.disabled = !hasTare;
          if (!hasTare) {
            previousTareCheckbox.checked = false;
          }
          const formattedTare = Number(tareLabel).toLocaleString('pt-BR', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0,
          });
          previousTareHelp.textContent = hasTare
            ? 'Tara anterior disponível' + (tareLabel ? ': ' + formattedTare + ' kg.' : '.')
            : 'Nenhuma tara anterior disponível para esta placa.';
        }

        function renderOptions(plates) {
          if (!plates.length) {
            optionsContainer.innerHTML = '<p class="weighbridge-plate-empty">Nenhuma placa recente encontrada.</p>';
            return;
          }

          optionsContainer.innerHTML = plates.map(function (plate) {
            const tare = Number(plate.peso_tara_kg).toLocaleString('pt-BR', {
              minimumFractionDigits: 0,
              maximumFractionDigits: 0,
            });
            const tareText = plate.tem_tara_anterior ? ' · tara ' + tare + ' kg' : '';
            return '<button class="weighbridge-plate-option" type="button" data-plate="' + plate.placa_caminhao + '" data-has-tare="' + (plate.tem_tara_anterior ? '1' : '0') + '" data-tare="' + (plate.peso_tara_kg || '') + '">' + plate.placa_caminhao + tareText + '</button>';
          }).join('');
        }

        async function fetchPlates() {
          if (controller) {
            controller.abort();
          }

          controller = new AbortController();
          const query = normalizePlate(plateInput.value);
          const response = await fetch('/balanca/entradas/placas?q=' + encodeURIComponent(query), { signal: controller.signal });

          if (!response.ok) {
            return;
          }

          const plates = await response.json();
          renderOptions(plates);
        }

        async function fetchPreviousTare() {
          const plate = normalizePlate(plateInput.value);

          if (plate.length < 7) {
            setPreviousTareState(false);
            return;
          }

          const response = await fetch('/balanca/entradas/tara-anterior?placa=' + encodeURIComponent(plate));

          if (!response.ok) {
            setPreviousTareState(false);
            return;
          }

          const tare = await response.json();
          setPreviousTareState(Boolean(tare && tare.id), tare && tare.peso_tara_kg);
        }

        optionsContainer.addEventListener('click', function (event) {
          const option = event.target.closest('.weighbridge-plate-option');

          if (!option) {
            return;
          }

          plateInput.value = option.dataset.plate;
          setPreviousTareState(option.dataset.hasTare === '1', option.dataset.tare);
        });

        dateInput.addEventListener('input', updateDefaultProduct);
        productSelect.addEventListener('change', function () {
          productWasChanged = true;
        });

        plateInput.addEventListener('input', function () {
          plateInput.value = normalizePlate(plateInput.value);
          fetchPlates().catch(function () {});
          fetchPreviousTare().catch(function () {});
        });

        updateDefaultProduct();
        fetchPreviousTare().catch(function () {});
      }());
    </script>
  </body>
</html>
