<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="home-page">
      <section class="hero-card" aria-labelledby="hero-title">
        <div class="hero-copy">
          <span class="eyebrow">Agronegócio com confiança</span>
          <h1 id="hero-title" class="h1">AgroLima</h1>
          <p class="lead">Soluções para armazenagem, cuidado e produtividade no campo.</p>
          <div class="hero-actions" aria-label="Ações principais">
            <a class="btn-primary-action" href="/contato">Contato</a>
            <a class="btn-secondary-action" href="/login">Login</a>
          </div>
        </div>
        <img class="hero-image" src="/images/silos.jpeg" alt="Silos agrícolas em uma propriedade rural">
      </section>
    </main>
    <footer class="site-footer">
      <img class="footer-logo" src="/images/logotipo%20agrolima.jpeg" alt="Logotipo da AgroLima">
      <span>AgroLima © 2026. Todos os direitos reservados.</span>
    </footer>
  </body>
</html>
