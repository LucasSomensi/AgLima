<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">

      <meta name="description" content="Bateladas anteriores do secador de grãos da AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Bateladas anteriores | Secador | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

  <body>
    <main class="page-shell admin-shell dryer-shell">
      <section class="content-card admin-card dryer-card" aria-labelledby="dryer-history-title">

          <div>
            <h1 id="dryer-history-title" class="page-title">Bateladas anteriores</h1>

          <a class="btn-secondary-action" href="/secador">Voltar ao secador</a>

        <section class="dryer-history-list" aria-label="Bateladas anteriores">

      </section>

    <footer class="site-footer">
