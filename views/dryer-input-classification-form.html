<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Classificar entrada pelo secador AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Classificar entrada | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="manifest" href="/manifest.webmanifest">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
      <link rel="apple-touch-icon" href="/icons/dryer-icon-192.png">
      <meta name="theme-color" content="#0f5f2e">
  </head>
  <body>
    <main class="page-shell admin-shell dryer-shell dryer-classification-shell">
      <section class="content-card admin-card dryer-card dryer-classification-card" aria-labelledby="dryer-classification-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Operador do silo</span>
            <h1 id="dryer-classification-title" class="page-title">Classificar entrada</h1>
            <a class="back-link admin-back-link" href="/secador">← Voltar ao secador</a>
          </div>
        </div>

        {{DRYER_CLASSIFICATION_ERROR}}
        <p class="page-description">{{INPUT_SUMMARY}}</p>

        <form class="contact-form contracts-form dryer-mobile-classification-form" action="/secador/entradas/{{ENTRADA_ID}}/classificacao" method="post" data-loading-message="Salvando classificação...">
          <label>Umidade (%)
            <input class="form-control" name="umidade_percent" type="number" min="0" max="100" step="0.001" value="{{UMIDADE_PERCENT}}" inputmode="decimal" required autofocus>
          </label>
          <label>Impureza (%)
            <input class="form-control" name="impureza_percent" type="number" min="0" max="100" step="0.001" value="{{IMPUREZA_PERCENT}}" inputmode="decimal" required>
          </label>
          <label>Grãos avariados (%)
            <input class="form-control" name="graos_avariados_percent" type="number" min="0" max="100" step="0.001" value="{{GRAOS_AVARIADOS_PERCENT}}" inputmode="decimal" required>
          </label>
          <div class="contracts-form-actions dryer-classification-actions">
            <button class="btn-primary-action" type="submit">Salvar classificação</button>
            <a class="btn-secondary-action" href="/secador">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
