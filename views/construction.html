<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Página em construção da AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Em construção | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell">
      <section class="content-card placeholder-card" aria-labelledby="construction-title">
        <span class="eyebrow">{{CONSTRUCTION_EYEBROW}}</span>
        <h1 id="construction-title" class="page-title">{{CONSTRUCTION_TITLE}}</h1>
        <p class="page-description">{{CONSTRUCTION_DESCRIPTION}}</p>
        {{CONSTRUCTION_BACK_LINK}}
        <form action="/logout" method="post">
          <button class="btn-primary-action" type="submit">Sair</button>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <img class="footer-logo" src="/images/logotipo%20agrolima.jpeg" alt="Logotipo da AgroLima">
      <span>AgroLima © 2026. Todos os direitos reservados.</span>
    </footer>
  </body>
</html>
