<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Adicionar classificação da entrada">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Classificação | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body class="wb-body">
    <main class="wb-shell">
      {{WB_TOPBAR}}
      {{SCALE_INPUT_ERROR}}
      <section class="wb-panel">
        <form class="wb-form" action="/balanca/entradas/{{ENTRADA_ID}}/classificacao" method="post">
          <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
          <div class="wb-form-grid">
            <label>Umidade (%)
              <input class="form-control" name="umidade_percent" type="number" min="0" max="100" step="0.001" value="{{UMIDADE_PERCENT}}" inputmode="decimal" required autofocus>
            </label>
            <label>Impureza (%)
              <input class="form-control" name="impureza_percent" type="number" min="0" max="100" step="0.001" value="{{IMPUREZA_PERCENT}}" inputmode="decimal" required>
            </label>
            <label>Avariados (%)
              <input class="form-control" name="graos_avariados_percent" type="number" min="0" max="100" step="0.001" value="{{GRAOS_AVARIADOS_PERCENT}}" inputmode="decimal" required>
            </label>
          </div>
          <div class="wb-form-actions">
            <button class="wb-btn wb-btn--primary" type="submit"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-check"></use></svg><span>Salvar classificação</span></button>
            <a class="wb-btn" href="{{WEIGHBRIDGE_HOME_HREF}}">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/weighbridge-ui.js"></script>
  </body>
</html>
