<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Adicionar classificação de entrada AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Adicionar classificação | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell weighbridge-shell">
      <section class="content-card admin-card weighbridge-card" aria-labelledby="input-classification-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área da balança</span>
            <h1 id="input-classification-title" class="page-title">Adicionar classificação</h1>
            <a class="back-link admin-back-link" href="{{WEIGHBRIDGE_HOME_HREF}}">{{WEIGHBRIDGE_HOME_LABEL}}</a>
          </div>
        </div>

        {{SCALE_INPUT_ERROR}}
        <p class="page-description">{{INPUT_SUMMARY}}</p>

        <form class="contact-form contracts-form" action="/balanca/entradas/{{ENTRADA_ID}}/classificacao" method="post">
            <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
          <div class="contracts-form-grid">
            <label>Umidade (%)
              <input class="form-control" name="umidade_percent" type="number" min="0" max="100" step="0.001" value="{{UMIDADE_PERCENT}}" inputmode="decimal" required>
            </label>
            <label>Impureza (%)
              <input class="form-control" name="impureza_percent" type="number" min="0" max="100" step="0.001" value="{{IMPUREZA_PERCENT}}" inputmode="decimal" required>
            </label>
            <label>Grãos avariados (%)
              <input class="form-control" name="graos_avariados_percent" type="number" min="0" max="100" step="0.001" value="{{GRAOS_AVARIADOS_PERCENT}}" inputmode="decimal" required>
            </label>
          </div>
          <div class="contracts-form-actions">
            <button class="btn-primary-action" type="submit">Salvar classificação</button>
            <a class="btn-secondary-action" href="{{WEIGHBRIDGE_HOME_HREF}}">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
