<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Iniciar nova batelada do secador de grãos da AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Iniciar batelada | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="manifest" href="/manifest.webmanifest">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
      <link rel="apple-touch-icon" href="/icons/dryer-icon-192.png">
      <meta name="theme-color" content="#0f5f2e">
  </head>
  <body>
    <main class="page-shell admin-shell dryer-shell">
      <section class="content-card admin-card dryer-card" aria-labelledby="start-batch-title">
        <div class="admin-header">
          <div>
            <h1 id="start-batch-title" class="page-title">Iniciar nova batelada</h1>
            <p class="admin-subtitle">Confirme a umidade inicial do secador antes de iniciar a batelada.</p>
          </div>
          <a class="btn-secondary-action" href="/secador">Voltar</a>
        </div>

        {{DRYER_ERROR}}

        <form class="dryer-start-batch-form" action="/secador/bateladas" method="post" data-confirm-message="Confirmar início da nova batelada com a umidade inicial informada?" data-loading-message="Iniciando batelada...">
          <label class="dryer-field-label" for="initial_moisture">Umidade inicial (%)</label>
          <input class="form-control" id="initial_moisture" name="initial_moisture" type="number" min="5" max="50" step="0.01" value="{{DEFAULT_INITIAL_MOISTURE}}" aria-label="Umidade inicial em porcentagem" inputmode="decimal" required>
          <p class="dryer-action-helper">O valor padrão usa a média das 5 últimas entradas da balança com umidade disponível. Se não houver 5 entradas, o padrão é 28%.</p>
          <div class="dryer-start-actions">
            <button class="btn-primary-action" type="submit">Confirmar e iniciar batelada</button>
            <a class="btn-secondary-action" href="/secador">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/dryer-pwa.js" defer></script>
    <script>
      document.querySelectorAll('.dryer-start-batch-form').forEach((form) => {
        form.addEventListener('submit', (event) => {
          if (form.dataset.submitting === 'true') {
            event.preventDefault();
            return;
          }

          const confirmMessage = form.dataset.confirmMessage;
          if (confirmMessage && !window.confirm(confirmMessage)) {
            event.preventDefault();
            return;
          }

          form.dataset.submitting = 'true';
          form.classList.add('is-submitting');

          form.querySelectorAll('button[type="submit"]').forEach((button) => {
            button.disabled = true;
            button.textContent = 'Aguarde...';
          });
        });
      });
    </script>
    <footer class="site-footer">
      <img class="footer-logo" src="/images/logotipo%20agrolima.jpeg" alt="Logotipo da AgroLima">
      <span>AgroLima © 2026. Todos os direitos reservados.</span>
    </footer>
  </body>
</html>
