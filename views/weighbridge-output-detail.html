<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Detalhes da saída da balança">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Saída | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body class="wb-body">
    <main class="wb-shell">
      {{WB_TOPBAR}}
      {{SCALE_OUTPUT_FLASH}}
      <div class="wb-hero">{{WEIGHTS}}</div>
      <section class="wb-panel">
        <dl class="wb-facts">{{FACTS}}</dl>
        <div class="wb-copy-grid" style="margin-top:8px">{{COPY_FIELDS}}</div>
      </section>
      {{SCALE_PHOTOS_SECTION}}
      {{SPLIT_SECTION}}
      {{EDIT_SECTION}}
      {{DELETE_SECTION}}
    </main>
    <script src="/js/deletion-reason.js"></script>
    <script src="/js/weighbridge-ui.js"></script>
    <script>
      const firstNetInput = document.getElementById('peso-liquido-primeira');
      const secondNetInput = document.getElementById('peso-liquido-segunda');

      function updateSecondNetWeight() {
        const totalNet = Number(firstNetInput.dataset.totalNet);
        const firstNet = Number(firstNetInput.value);

        if (!Number.isFinite(totalNet) || !Number.isFinite(firstNet) || firstNet <= 0 || firstNet >= totalNet) {
          secondNetInput.value = '-';
          return;
        }

        secondNetInput.value = (totalNet - firstNet).toLocaleString('pt-BR', {
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        });
      }

      if (firstNetInput && secondNetInput) {
        firstNetInput.addEventListener('input', updateSecondNetWeight);
        updateSecondNetWeight();
      }
    </script>
  </body>
</html>
