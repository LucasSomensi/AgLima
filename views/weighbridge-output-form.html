<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Adicionar saída na balança">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Nova saída | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body class="wb-body">
    <main class="wb-shell">
      {{WB_TOPBAR}}
      {{SCALE_OUTPUT_ERROR}}
      <section class="wb-panel">
        <form class="wb-form" action="/balanca/saidas" method="post">
          <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
          <div class="wb-form-grid">
            <label>Placa
              <input class="form-control" name="placa_caminhao" type="text" value="{{PLACA_CAMINHAO}}" placeholder="ABC1D23" maxlength="10" required autofocus>
            </label>
            <label>Produto
              <select class="form-control" name="produto" required>
                <option value="">Selecione</option>
                <option value="milho"{{PRODUCT_MILHO_SELECTED}}>Milho</option>
                <option value="soja"{{PRODUCT_SOJA_SELECTED}}>Soja</option>
              </select>
            </label>
            <label>Nome do motorista (opcional)
              <input class="form-control" name="nome_motorista" type="text" value="{{NOME_MOTORISTA}}" maxlength="120" autocomplete="off">
            </label>
            <label>Data/hora
              <input class="form-control" name="data_saida" type="datetime-local" value="{{DATA_SAIDA}}" required data-scale-photo-datetime>
            </label>
            <label class="wb-weight-field">Tara (kg)
              <span class="weighbridge-weight-input-group">
                <input class="form-control" id="peso_tara_kg" name="peso_tara_kg" type="number" min="0.001" step="0.001" value="{{PESO_TARA_KG}}" inputmode="decimal" required>
                <button class="weighbridge-weight-fetch" type="button" data-scale-weight-target="peso_tara_kg" aria-label="Preencher tara com o peso da balança 1" title="Usar peso da balança 1">
                  <svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-scale"></use></svg>
                </button>
                <button class="weighbridge-weight-fetch" type="button" data-scale-photo-pick-target="peso_tara_kg" aria-label="Preencher tara com uma foto automática da balança 1" title="Usar foto automática da balança 1">
                  <svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-photo"></use></svg>
                </button>
              </span>
              <span class="weighbridge-weight-feedback" aria-live="polite"></span>
              <input type="hidden" name="foto_captura_id" value="{{FOTO_CAPTURA_ID}}" data-scale-photo-capture>
              <span class="weighbridge-weight-photo" data-scale-photo-preview hidden></span>
            </label>
          </div>
          <div class="wb-form-actions">
            <button class="wb-btn wb-btn--primary" type="submit"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-check"></use></svg><span>Confirmar saída</span></button>
            <a class="wb-btn" href="{{WEIGHBRIDGE_HOME_HREF}}">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/js/weighbridge-scale-weight.js"></script>
    <script src="/js/weighbridge-ui.js"></script>
  </body>
</html>
