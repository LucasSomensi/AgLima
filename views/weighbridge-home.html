<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Painel da balança da AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Balança | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body class="wb-body">
    <main class="wb-shell">
      <header class="wb-topbar">
        <a class="wb-brand" href="/balanca"><svg class="wb-i wb-i-lg" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-scale"></use></svg>Balança</a>
        {{LIVE_WEIGHT}}
        <nav class="wb-topbar-end" aria-label="Navegação da balança">
          <a class="wb-btn wb-btn--icon" href="/balanca/contratos" title="Contratos" aria-label="Contratos"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-contract"></use></svg></a>
          <a class="wb-btn wb-btn--icon" href="/balanca/fotos" title="Fotos automáticas" aria-label="Fotos automáticas"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-photo"></use></svg></a>
          <span class="wb-sep" aria-hidden="true"></span>
          <form action="/logout" method="post">
            <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
            <button class="wb-btn wb-btn--icon" type="submit" title="Sair" aria-label="Sair"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-logout"></use></svg></button>
          </form>
        </nav>
      </header>

      {{WEIGHBRIDGE_FLASH}}

      <div class="wb-quick">
        <a class="wb-quick-btn wb-quick-btn--in" href="/balanca/entradas/nova" data-shortcut="e" title="Nova entrada (E)"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-in"></use></svg>Entrada<kbd>E</kbd></a>
        <a class="wb-quick-btn wb-quick-btn--out" href="/balanca/saidas/nova" data-shortcut="s" title="Nova saída (S)"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-out"></use></svg>Saída<kbd>S</kbd></a>
        <a class="wb-quick-btn wb-quick-btn--avulsa" href="/balanca/avulsas/nova" data-shortcut="a" title="Nova pesagem avulsa (A)"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-avulsa"></use></svg>Avulsa<kbd>A</kbd></a>
        {{DAY_SUMMARY}}
      </div>

      {{YARD_SECTION}}

      <section class="wb-panel" aria-labelledby="recent-title">
        <div class="wb-panel-head">
          <h2 id="recent-title">Recentes</h2>
          <div class="wb-seg" role="group" aria-label="Filtrar movimentações" data-movement-filter="recent-table">
            <button type="button" data-filter="todas" aria-pressed="true">Todas</button>
            <button type="button" data-filter="entrada" aria-pressed="false" title="Entradas" aria-label="Entradas"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-in"></use></svg></button>
            <button type="button" data-filter="saida" aria-pressed="false" title="Saídas" aria-label="Saídas"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-out"></use></svg></button>
            <button type="button" data-filter="avulsa" aria-pressed="false" title="Avulsas" aria-label="Avulsas"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-avulsa"></use></svg></button>
          </div>
          <div class="wb-panel-tools" aria-label="Listas completas">
            <a class="wb-btn wb-btn--sm" href="/balanca/entradas" title="Lista completa de entradas" aria-label="Lista completa de entradas"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-list"></use></svg><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-in"></use></svg></a>
            <a class="wb-btn wb-btn--sm" href="/balanca/saidas" title="Lista completa de saídas" aria-label="Lista completa de saídas"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-list"></use></svg><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-out"></use></svg></a>
            <a class="wb-btn wb-btn--sm" href="/balanca/avulsas" title="Lista completa de pesagens avulsas" aria-label="Lista completa de pesagens avulsas"><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-list"></use></svg><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-avulsa"></use></svg></a>
          </div>
        </div>
        <div class="wb-table-wrap">
          <table class="wb-table" id="recent-table">
            <thead>
          {{RECENT_HEAD}}
            </thead>
            <tbody>{{RECENT_ROWS}}</tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/js/weighbridge-ui.js"></script>
  </body>
</html>
