<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Painel da balança da AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Balança | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell weighbridge-shell">
      <section class="content-card admin-card weighbridge-card" aria-labelledby="weighbridge-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área da balança</span>
            <h1 id="weighbridge-title" class="page-title">Balança</h1>
          </div>
          <form action="/logout" method="post">
            <button class="btn-secondary-action" type="submit">Sair</button>
          </form>
        </div>

        {{WEIGHBRIDGE_MESSAGE}}
        {{WEIGHBRIDGE_ERROR}}

        <nav class="admin-module-grid weighbridge-actions" aria-label="Ações da balança">
          <a class="admin-module-card weighbridge-action-card" href="/balanca/entradas/nova">
            <span class="weighbridge-action-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" focusable="false" role="img">
                <path d="M24 6v21" />
                <path d="m15 18 9 9 9-9" />
                <path d="M12 35h24" />
                <path d="M16 35 12 42" />
                <path d="M32 35l4 7" />
                <path d="M17 35l3-8h8l3 8" />
              </svg>
            </span>
            <span class="admin-module-label">Adicionar entrada</span>
          </a>
          <a class="admin-module-card weighbridge-action-card" href="/balanca/saidas/nova">
            <span class="weighbridge-action-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" focusable="false" role="img">
                <path d="M24 29V8" />
                <path d="m15 17 9-9 9 9" />
                <path d="M12 35h24" />
                <path d="M16 35 12 42" />
                <path d="M32 35l4 7" />
                <path d="M17 35l3-8h8l3 8" />
              </svg>
            </span>
            <span class="admin-module-label">Adicionar saída</span>
          </a>
          <a class="admin-module-card weighbridge-action-card" href="/balanca/contratos">
            <span class="weighbridge-action-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" focusable="false" role="img">
                <path d="M15 6h14l7 7v29H15z" />
                <path d="M29 6v8h7" />
                <path d="M20 22h11" />
                <path d="M20 29h11" />
                <path d="M20 36h7" />
              </svg>
            </span>
            <span class="admin-module-label">Visualizar contratos</span>
          </a>
        </nav>

        <section class="admin-section" aria-labelledby="recent-outputs-title">
          <div class="admin-section-header">
            <h2 id="recent-outputs-title">Últimas 10 saídas</h2>
            <a class="btn-secondary-action" href="/balanca/saidas">Ver lista completa</a>
          </div>
          <div class="admin-table-wrapper">
            <table class="admin-table weighbridge-table">
              <thead>
                <tr>
                  <th>Data/hora</th>
                  <th>Placa</th>
                  <th>Produto</th>
                  <th>Líquido</th>
                  <th>Contrato</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody>
                {{SCALE_OUTPUT_ROWS}}
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
