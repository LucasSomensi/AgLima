<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Associar saída a contrato">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Associar contrato | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body class="wb-body">
    <main class="wb-shell">
      {{WB_TOPBAR}}
      {{ASSOCIATION_ERROR}}
      <section class="wb-panel">
        <div class="wb-form-grid wb-form-grid--2 wb-form">
          <form class="wb-form" action="/balanca/saidas/{{OUTPUT_ID}}/associar" method="get">
            <label>Comprador
              <select class="form-control" name="comprador_id" required onchange="this.form.submit()" autofocus>
                <option value="">Selecione</option>
                {{BUYER_OPTIONS}}
              </select>
            </label>
            <noscript><button class="wb-btn" type="submit">Filtrar</button></noscript>
          </form>

          <form class="wb-form" id="associate-form" action="/balanca/saidas/{{OUTPUT_ID}}/associar" method="post">
            <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}">
            <input type="hidden" name="comprador_id" value="{{SELECTED_BUYER_ID}}">
            <label>Contrato
              <select class="form-control" name="contrato_id" required {{ASSOCIATE_DISABLED}}>
                {{CONTRACT_OPTIONS}}
              </select>
              <span class="wb-hint">{{CONTRACT_HELP}}</span>
            </label>
          </form>
        </div>
        <div class="wb-form-actions">
          <button class="wb-btn wb-btn--primary" type="submit" form="associate-form" {{ASSOCIATE_DISABLED}}><svg class="wb-i" aria-hidden="true" focusable="false"><use href="/icons/wb.svg#i-link"></use></svg><span>Associar</span></button>
          <a class="wb-btn" href="{{WEIGHBRIDGE_HOME_HREF}}">Cancelar</a>
        </div>
      </section>
    </main>
    <script src="/js/weighbridge-ui.js"></script>
  </body>
</html>
