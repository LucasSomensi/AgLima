<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Associar saída da balança a contrato AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Associar saída | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell weighbridge-shell">
      <section class="content-card admin-card weighbridge-card" aria-labelledby="associate-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área da balança</span>
            <h1 id="associate-title" class="page-title">Associar saída</h1>
            <p class="page-description">{{OUTPUT_SUMMARY}}</p>
            <a class="back-link admin-back-link" href="{{WEIGHBRIDGE_HOME_HREF}}">{{WEIGHBRIDGE_HOME_LABEL}}</a>
          </div>
        </div>

        {{ASSOCIATION_ERROR}}

        <form class="contact-form contracts-form" action="/balanca/saidas/{{OUTPUT_ID}}/associar" method="get">
          <label>Comprador
            <select class="form-control" name="comprador_id" required onchange="this.form.submit()">
              <option value="">Selecione o comprador primeiro</option>
              {{BUYER_OPTIONS}}
            </select>
          </label>
          <noscript><button class="btn-secondary-action" type="submit">Filtrar contratos</button></noscript>
        </form>

        <form class="contact-form contracts-form" action="/balanca/saidas/{{OUTPUT_ID}}/associar" method="post">
          <input type="hidden" name="comprador_id" value="{{SELECTED_BUYER_ID}}">
          <label>Contrato disponível
            <select class="form-control" name="contrato_id" required {{ASSOCIATE_DISABLED}}>
              {{CONTRACT_OPTIONS}}
            </select>
          </label>
          <p class="contracts-filter-help">{{CONTRACT_HELP}}</p>
          <div class="contracts-form-actions">
            <button class="btn-primary-action" type="submit" {{ASSOCIATE_DISABLED}}>Associar saída</button>
            <a class="btn-secondary-action" href="{{WEIGHBRIDGE_HOME_HREF}}">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
