<!doctype html>
<html lang="pt-BR">
  <head>
      <meta charset="utf-8">
      <meta name="author" content="Lucas">
      <meta name="description" content="Adicionar tara de saída AgroLima">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Adicionar tara da saída | AgroLima</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap">
      <link rel="stylesheet" href="/css/styles.css">
      <link rel="icon" href="/favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main class="page-shell admin-shell weighbridge-shell">
      <section class="content-card admin-card weighbridge-card" aria-labelledby="output-tare-title">
        <div class="admin-header">
          <div>
            <span class="eyebrow">Área da balança</span>
            <h1 id="output-tare-title" class="page-title">Adicionar tara da saída</h1>
            <a class="back-link admin-back-link" href="/balanca">← Voltar à balança</a>
          </div>
        </div>

        {{SCALE_OUTPUT_ERROR}}

        <p class="admin-muted">{{OUTPUT_SUMMARY}}</p>

        <form class="contact-form contracts-form" action="/balanca/saidas/{{SAIDA_ID}}/tara" method="post">
          <div class="contracts-form-grid contracts-form-grid-two">
            <label>Peso tara (kg)
              <input class="form-control" name="peso_tara_kg" type="number" min="0.001" step="0.001" value="{{PESO_TARA_KG}}" inputmode="decimal" required>
            </label>
          </div>
          <div class="contracts-form-actions">
            <button class="btn-primary-action" type="submit">Salvar tara</button>
            <a class="btn-secondary-action" href="/balanca">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
